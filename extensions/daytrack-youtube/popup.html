<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 340px; padding: 12px; margin: 0; }
      h2 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; }
      input, button { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; }
      button { background: #1a73e8; color: #fff; border: none; cursor: pointer; }
      button:disabled { opacity: .5; }
      .item { display: flex; align-items: flex-start; gap: 6px; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 12px; }
      .item a { color: #1a73e8; text-decoration: none; line-height: 1.3; }
      .muted { color: #888; font-size: 12px; }
      #status { font-size: 12px; margin: 6px 0; min-height: 16px; }
    </style>
  </head>
  <body>
    <h2>DayTrack YouTube Collector</h2>
    <div class="row">
      <input id="email" type="email" placeholder="email kamu" style="flex:1" />
      <button id="login">Login</button>
    </div>
    <div id="status" class="muted"></div>
    <div id="list"></div>
    <div class="row" style="margin-top:8px">
      <button id="save" style="flex:1">Simpan ke Playlist</button>
      <button id="clear" style="background:#888">Bersih</button>
    </div>
    <p class="muted">Centang video di YouTube, lalu klik Simpan. Login pakai magic link (cek email).</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
